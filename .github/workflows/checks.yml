name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc -p contracts/tsconfig.json
      - run: npx tsc -p backend/tsconfig.json
      - run: npm test
      - run: npm run test:emissions
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install CPU test runtime
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
